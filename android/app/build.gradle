plugins { id 'com.android.application' }
def embeddedSetup = providers.gradleProperty('embeddedSetup').orElse('false').get().toBoolean()
def customVulkan = providers.gradleProperty('customVulkan').orElse('false').get().toBoolean()
def guestBase = providers.gradleProperty('guestBase').orElse('0x1000000000').get()
if (!(guestBase ==~ /0x[0-9a-fA-F]+/)) throw new GradleException('guestBase must be a hexadecimal address')
android {
    namespace 'com.bblueskyy.lasrecomp'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.bblueskyy.lasrecomp'
        minSdk 28
        targetSdk 35
        versionCode 2
        versionName '0.2.0-runtime-dev'
        ndk { abiFilters 'arm64-v8a' }
        buildConfigField 'boolean', 'EMBEDDED_SETUP', embeddedSetup.toString()
        buildConfigField 'boolean', 'CUSTOM_VULKAN', customVulkan.toString()
        externalNativeBuild { cmake {
            arguments '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON',
                "-DLARECOMP_ANDROID_EMBEDDED_SETUP=${embeddedSetup ? 'ON' : 'OFF'}",
                "-DLARECOMP_GUEST_BASE=${guestBase}",
                "-DLARECOMP_ANDROID_CUSTOM_VULKAN=${customVulkan ? 'ON' : 'OFF'}"
        } }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
    buildFeatures { buildConfig = true }
    packaging {
        jniLibs { useLegacyPackaging = true }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main.java.srcDirs += ['../deps/src/SDL/android-project/app/src/main/java']
        if (embeddedSetup) {
            main.assets.srcDirs += ['../deps/embedded-assets']
            main.jniLibs.srcDirs += ['../deps/setup-jni']
        }
        if (customVulkan) main.jniLibs.srcDirs += ['../deps/driver-jni']
    }
}
