name: Android ARM64 bootstrap

on:
  push:
    branches: [port/android-arm64]
    paths:
      - 'android/**'
      - 'runtime/platform.h'
      - 'runtime/platform/android_compat.h'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'runtime/platform.h'
      - 'runtime/platform/android_compat.h'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-24.04 runner already includes Android cmdline-tools.
      - name: Install Android SDK packages
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDKROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build diagnostic ARM64 APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: LASRecomp-Android-arm64-diagnostic
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
